<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nihongo Premium — Admin</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>body{font-family:system-ui;background:#081224;color:#eef1f8;margin:0}*{box-sizing:border-box}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#121c30;border:1px solid #263553;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #33476d;background:#0b1528;color:inherit}button{cursor:pointer;background:#3478f6;border:0;font-weight:700}.danger{background:#b83a4b}.muted{color:#9aaaca;font-size:13px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.hidden{display:none}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#19335d;font-size:12px}.ok{background:#155b3a}.bad{background:#662637}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #263553;text-align:left;font-size:13px} @media(max-width:700px){table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><div class="wrap">
<div id="login" class="card" style="max-width:420px;margin:60px auto"><h2>🔐 Admin Nihongo Premium</h2><p class="muted">Hanya email admin yang terdaftar di Vercel yang dapat mengelola user.</p><input id="email" type="email" placeholder="Email admin"><br><br><input id="password" type="password" placeholder="Password"><br><br><button id="loginBtn">Masuk Admin</button><p id="loginMsg" class="muted"></p></div>
<main id="app" class="hidden"><div class="row"><div><h1>👑 Admin Premium</h1><p class="muted">Kelola akun tanpa upload ulang index.html.</p></div><button id="logout" style="max-width:140px">Keluar</button></div>
<div class="card"><h3>➕ Tambah Pembeli</h3><div class="grid"><input id="newEmail" type="email" placeholder="Email pembeli"><input id="newPassword" type="password" placeholder="Password minimal 8 karakter"><select id="duration"><option value="30">Premium 30 hari</option><option value="90">Premium 90 hari</option><option value="365">Premium 1 tahun</option><option value="9999">Lifetime</option></select></div><br><button id="createBtn">Buat Akun & Aktifkan Premium</button><p id="createMsg" class="muted"></p></div>
<div class="card"><div class="row"><div><h3>👥 Daftar User</h3><p class="muted">Status dan masa berlaku diambil langsung dari Firebase.</p></div><button id="refresh" style="max-width:130px">↻ Refresh</button></div><div class="grid"><input id="search" placeholder="Cari email / UID..."><div class="pill" id="stats" style="padding:12px">Memuat statistik...</div></div><br><div id="table">Memuat...</div></div></main></div>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyAxbjct95CVVLnL_NdJ9X-IjR2ax1peW0E",authDomain:"nihongo-premium.firebaseapp.com",databaseURL:"https://nihongo-premium-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"nihongo-premium",storageBucket:"nihongo-premium.firebasestorage.app",messagingSenderId:"1056567790903",appId:"1:1056567790903:web:6a3de665e9170d846a9eb2"};
firebase.initializeApp(FIREBASE_CONFIG);const auth=firebase.auth();let users=[];
const $=id=>document.getElementById(id); function msg(el,s){el.textContent=s} function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(action,data={}){const u=auth.currentUser;if(!u)throw Error('Belum login');const token=await u.getIdToken(true);const r=await fetch('/api/admin-users',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action,...data})});const d=await r.json().catch(()=>({error:'server_error'}));if(!r.ok)throw Error(d.error||'Gagal');return d}
$('loginBtn').onclick=async()=>{msg($('loginMsg'),'Memproses...');try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);await load()}catch(e){msg($('loginMsg'),'Gagal masuk: '+e.message)}};
auth.onAuthStateChanged(async u=>{if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}try{await load()}catch(e){await auth.signOut();msg($('loginMsg'),'Akun ini bukan admin atau konfigurasi server belum benar.')}});
async function load(){const d=await api('list');users=d.users||[];$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}
function fmt(ts){return ts?new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'Lifetime'}
function licenseState(u){const l=u.license||{};return l.active!==false&&(!l.expiresAt||Number(l.expiresAt)>Date.now())&&!u.disabled}
function render(){
  const q=String($('search')?.value||'').trim().toLowerCase();
  const filtered=users.filter(u=>!q||String(u.email||'').toLowerCase().includes(q)||String(u.uid||'').toLowerCase().includes(q));
  const activeCount=users.filter(licenseState).length, lifetimeCount=users.filter(u=>(u.license||{}).duration==9999&&licenseState(u)).length, expiredCount=users.length-activeCount;
  $('stats').textContent=`Total ${users.length} • Aktif ${activeCount} • Expired/Nonaktif ${expiredCount} • Lifetime ${lifetimeCount}`;
  if(!filtered.length){$('table').innerHTML='<p class="muted">Tidak ada user yang cocok.</p>';return}
  let h='<table><tr><th>Email</th><th>Status</th><th>Masa berlaku</th><th>Aksi</th></tr>';
  for(const u of filtered){const l=u.license||{},active=licenseState(u),status=active?'AKTIF':'NONAKTIF',exp=l.duration==9999?'Lifetime':fmt(l.expiresAt);h+=`<tr><td>${esc(u.email)}<br><span class="muted">${esc(u.uid)}</span></td><td><span class="pill ${active?'ok':'bad'}">${status}</span></td><td>${esc(exp)}</td><td><div class="row"><button onclick="renew('${esc(u.uid)}')">Perpanjang</button><button onclick="resetPassword('${esc(u.uid)}')">Password</button><button onclick="resetDevice('${esc(u.uid)}')">🔓 Reset Device</button><button onclick="toggle('${esc(u.uid)}',${active})">${active?'Nonaktifkan':'Aktifkan'}</button><button class="danger" onclick="delUser('${esc(u.uid)}')">Hapus</button></div></td></tr>`}
  h+='</table>';$('table').innerHTML=h
}
window.renew=async uid=>{const d=prompt('Masa baru: 30, 90, 365, atau 9999 (Lifetime)','30');if(!d)return;try{await api('update',{uid,duration:Number(d),renew:true,active:true,disabled:false});await load()}catch(e){alert(e.message)}};
window.toggle=async(uid,active)=>{try{await api('update',{uid,active:!active,disabled:active});await load()}catch(e){alert(e.message)}};
window.delUser=async uid=>{if(!confirm('Hapus akun dan lisensinya?'))return;try{await api('delete',{uid});await load()}catch(e){alert(e.message)}};
window.resetPassword=async uid=>{const p=prompt('Password baru (minimal 8 karakter):','');if(p===null)return;if(p.length<8){alert('Password minimal 8 karakter.');return}if(!confirm('Ganti password user ini?'))return;try{await api('resetPassword',{uid,password:p});alert('Password berhasil diubah.');}catch(e){alert(e.message)}};
window.resetDevice=async uid=>{if(!confirm('Reset perangkat user ini? User akan bisa login kembali di perangkat lain.'))return;try{await api('resetDevice',{uid});alert('Device berhasil di-reset. User sekarang bisa login kembali.');await load()}catch(e){alert(e.message)}};
$('createBtn').onclick=async()=>{msg($('createMsg'),'Membuat akun...');try{const d=await api('create',{email:$('newEmail').value,password:$('newPassword').value,duration:Number($('duration').value)});msg($('createMsg'),'Berhasil: '+d.user.email);$('newEmail').value='';$('newPassword').value='';await load()}catch(e){msg($('createMsg'),'Gagal: '+e.message)}};
$('refresh').onclick=load;$('logout').onclick=()=>auth.signOut();$('search').addEventListener('input',render);
</script></body></html>
