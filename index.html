<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nihongo Premium</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#081224;--card:rgba(20,28,48,.6);--border:rgba(140,160,220,.1);--border-bright:rgba(140,160,220,.25);--text:#eef1f8;--text-dim:#91a8c8;--text-soft:#c0c8dc;--amber:#7dc0ff;--indigo:#5ea7ff;--mint:#5ac8fa;--rose:#60a5fa;--violet:#72a7ff;--gp:linear-gradient(135deg,#5ea7ff 0%,#39c8ff 100%);--gg:linear-gradient(135deg,#7dc0ff 0%,#4f8cff 100%);--ge:linear-gradient(135deg,#5ac8fa 0%,#258bd8 100%);--gv:linear-gradient(135deg,#72a7ff 0%,#3f6fe5 100%)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 900px 600px at 12% -5%,rgba(94,167,255,.15),transparent 55%),radial-gradient(ellipse 800px 600px at 88% 8%,rgba(94,167,255,.12),transparent 55%);pointer-events:none;z-index:0}
body>*{position:relative;z-index:1}
.premium-gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-start;justify-content:center;background:rgba(10,14,26,.92);backdrop-filter:blur(20px);padding:20px;overflow-y:auto}
.premium-gate.hidden{display:none}
.gate-container{max-width:520px;width:100%;margin:auto;padding:20px 0}
.gate-card{background:linear-gradient(145deg,rgba(20,28,48,.98),rgba(15,20,36,.98));border:1px solid var(--border-bright);border-radius:28px;padding:32px 28px;text-align:center;position:relative;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6);margin-bottom:16px}
.gate-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gg)}
.gate-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;background:rgba(94,167,255,.12);border:1px solid rgba(94,167,255,.35);border-radius:100px;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:16px}
.gate-card h2{font-size:28px;font-weight:900;margin-bottom:6px;background:linear-gradient(180deg,#fff 0%,#b8c0d8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-card .subtitle{color:var(--text-dim);font-size:12px;margin-bottom:20px}
.gate-features{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;text-align:left}
.gate-feature{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-soft);padding:8px 12px;background:rgba(255,255,255,.03);border-radius:10px;border:1px solid var(--border)}
.gate-feature .check{width:18px;height:18px;border-radius:50%;background:var(--ge);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:900;flex-shrink:0}
.price-table{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:16px}
.price-table-header{background:rgba(94,167,255,.1);padding:10px;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#7dc0ff}
.price-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer}
.price-row.selected{background:rgba(94,167,255,.10);border-left:3px solid var(--indigo)}
.price-info{text-align:left;flex:1}
.price-duration{font-size:13px;font-weight:800}
.price-desc{font-size:11px;color:var(--text-dim);margin-top:2px}
.price-amount{font-size:17px;font-weight:900;color:#7dc0ff}.price-original{font-size:12px;color:var(--text-dim);text-decoration:line-through;margin-bottom:2px}.price-final{font-size:17px;font-weight:900;color:#7dc0ff}.price-discount-badge{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:rgba(94,167,255,.14);color:#7dc0ff;font-size:9px;font-weight:800}
.btn-wa{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;background:linear-gradient(135deg,#4f8cff 0%,#258bd8 100%);color:#fff;border:none;border-radius:100px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;text-transform:uppercase;text-decoration:none;margin-bottom:10px;box-shadow:0 8px 24px rgba(79,140,255,.35)}
.btn-login-link{width:100%;background:none;border:1px solid var(--border-bright);color:var(--text-soft);padding:12px;border-radius:100px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.reviews-section{background:linear-gradient(145deg,rgba(20,28,48,.98),rgba(15,20,36,.98));border:1px solid var(--border-bright);border-radius:20px;padding:20px;margin-bottom:16px}
.reviews-section h3{font-size:13px;font-weight:800;margin-bottom:12px;color:var(--amber);text-align:center}
.review-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.review-stars{font-size:14px;color:var(--amber);margin-bottom:4px}
.review-name{font-size:12px;font-weight:800;margin-bottom:3px}
.review-text{font-size:11px;color:var(--text-dim);line-height:1.5}
.login-page{display:none}
.login-page.show{display:block}
.login-field{margin-bottom:12px;text-align:left}
.login-field label{display:block;font-size:11px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.login-input{width:100%;background:rgba(94,167,255,.05);border:1px solid var(--border-bright);border-radius:12px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none}
.login-error{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);color:#b9dcff;padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:12px;display:none;line-height:1.6}
.login-error.show{display:block}
.btn-login{width:100%;padding:14px;background:var(--gp);color:#081224;border:none;border-radius:100px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;text-transform:uppercase;margin-bottom:8px}
.btn-login:disabled{opacity:.7;cursor:wait}
.btn-back-store{width:100%;padding:10px;background:none;border:1px solid var(--border-bright);color:var(--text-dim);border-radius:100px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}
.loading-overlay{position:fixed;inset:0;background:rgba(10,14,26,.95);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-overlay.hidden{display:none}
.loading-spinner{width:48px;height:48px;border:4px solid rgba(94,167,255,.2);border-top-color:#5ea7ff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text-dim);font-weight:600}
#mainApp.blurred{filter:blur(8px);pointer-events:none;user-select:none}
.tabs{position:sticky;top:10px;z-index:100;display:flex;gap:6px;padding:6px;margin:10px auto 20px;width:fit-content;max-width:calc(100% - 20px);background:rgba(15,20,36,.9);backdrop-filter:blur(20px);border:1px solid var(--border-bright);border-radius:100px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{background:none;border:none;color:var(--text-dim);font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;border-radius:100px;flex-shrink:0}
.tab-btn.active{color:#081224;background:var(--gp);font-weight:800}
.tab-content{display:none}
.tab-content.active{display:block}
header.hero{padding:50px 24px 44px;text-align:center;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
header.hero::before{content:"日本語";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:200px;font-weight:900;color:rgba(94,167,255,.04);pointer-events:none;white-space:nowrap;letter-spacing:-10px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;background:rgba(94,167,255,.12);border:1px solid rgba(94,167,255,.3);border-radius:100px;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#7dc0ff;margin-bottom:20px;position:relative}
header.hero h1{font-size:clamp(28px,6vw,48px);font-weight:900;margin-bottom:14px;letter-spacing:-1.5px;line-height:1.1;background:linear-gradient(180deg,#fff 0%,#b8c0d8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
header.hero h1 .gold{background:var(--gp);-webkit-background-clip:text;background-clip:text;color:transparent}
header.hero p{color:var(--text-dim);font-size:14px;max-width:560px;margin:0 auto}
.container{max-width:900px;margin:0 auto;padding:30px 18px}
.learn-tabs{display:flex;gap:8px;margin-bottom:24px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.learn-tabs::-webkit-scrollbar{display:none}
.learn-tab{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text-soft);padding:9px 16px;border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0}
.learn-tab.active{background:var(--gp);color:#081224;border-color:transparent;font-weight:800}
.learn-content{display:none}
.learn-content.active{display:block}
.lesson-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px 24px;margin-bottom:16px}
.lesson-card h3{font-size:19px;font-weight:800;margin-bottom:12px;background:var(--gp);-webkit-background-clip:text;background-clip:text;color:transparent}
.lesson-card h4{font-size:14px;font-weight:700;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.lesson-card h4::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--gp)}
.lesson-card p{font-size:13px;margin-bottom:10px;color:var(--text-soft)}
.kana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin:14px 0}
.kana-item{background:linear-gradient(145deg,rgba(94,167,255,.06),rgba(77,212,255,.02));border:1px solid var(--border);border-radius:14px;padding:14px 6px 12px;text-align:center;cursor:pointer}
.kana-char{font-size:26px;font-weight:700;color:#fff;line-height:1.2;font-family:"Hiragino Sans",sans-serif}
.kana-romaji{font-size:10px;color:#7dc0ff;margin-top:4px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.kanji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin:14px 0}
.kanji-item{background:linear-gradient(145deg,rgba(94,167,255,.06),rgba(94,167,255,.02));border:1px solid var(--border);border-radius:14px;padding:12px 6px 10px;text-align:center;cursor:pointer}
.kanji-char{font-size:28px;font-weight:700;color:#fff;font-family:"Hiragino Sans",sans-serif}
.kanji-mean{font-size:10px;color:var(--amber);margin-top:6px;font-weight:700}
.kanji-read{font-size:9px;color:var(--text-dim);margin-top:2px}
.phrase-row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:8px;cursor:pointer}
.phrase-jp{font-size:16px;font-weight:700;font-family:"Hiragino Sans",sans-serif;min-width:140px}
.phrase-romaji{font-size:11px;color:var(--amber);font-weight:700;min-width:140px}
.phrase-id{font-size:12px;color:var(--text-dim);flex:1}
.grammar-box{background:linear-gradient(135deg,rgba(94,167,255,.08),rgba(94,167,255,.02));border-left:3px solid var(--indigo);border-radius:0 14px 14px 0;padding:14px 18px;margin:12px 0}
.grammar-box .pattern{font-size:15px;font-weight:800;color:#7dc0ff;margin-bottom:5px;font-family:"Hiragino Sans",sans-serif}
.grammar-box .meaning{font-size:12px;color:var(--text-dim);margin-bottom:8px}
.grammar-box .example{font-size:13px;line-height:1.7}
.grammar-box .example .jp{font-weight:700;font-family:"Hiragino Sans",sans-serif}
.grammar-box .example .dim{color:var(--text-dim);font-size:12px;display:block;margin-top:2px}
.tip-box{padding:14px 18px;border-radius:14px;margin:14px 0;font-size:13px;background:rgba(90,200,250,.08);border:1px solid rgba(90,200,250,.25);color:#b9dcff}
.btn-premium{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;background:var(--gp);color:#081224;border:none;border-radius:100px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;text-transform:uppercase}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--border-bright);border-radius:100px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.quiz-container{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;text-align:center}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
.quiz-progress-text{font-size:11px;color:var(--text-dim);font-weight:700;text-transform:uppercase}
.quiz-score{font-size:13px;font-weight:800;color:var(--amber)}
.quiz-question-label{font-size:10px;color:#7dc0ff;letter-spacing:2.5px;text-transform:uppercase;font-weight:800;margin-bottom:14px}
.quiz-question{font-size:clamp(32px,7vw,48px);font-weight:800;font-family:"Hiragino Sans",sans-serif;margin-bottom:10px;background:var(--gp);-webkit-background-clip:text;background-clip:text;color:transparent}
.quiz-hint{font-size:13px;color:var(--text-dim);margin-bottom:24px}
.quiz-options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.quiz-option{padding:16px 18px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--text);text-align:center}
.quiz-option.correct{background:rgba(90,200,250,.15);border-color:var(--mint);color:#b9dcff}
.quiz-option.wrong{background:rgba(96,165,250,.15);border-color:var(--rose);color:#b9dcff}
.translate-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px 24px;margin-bottom:16px}
.translate-box .box-title{font-size:18px;font-weight:800;margin-bottom:6px;background:var(--gp);-webkit-background-clip:text;background-clip:text;color:transparent}
.translate-box .box-subtitle{font-size:12px;color:var(--text-dim);margin-bottom:16px}
.translate-input-wrap{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.translate-input{flex:1;min-width:200px;background:rgba(94,167,255,.05);border:1px solid var(--border-bright);border-radius:12px;padding:14px 18px;color:var(--text);font-family:inherit;font-size:15px;outline:none}
.dict-status{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:14px;background:rgba(90,200,250,.06);border:1px solid rgba(90,200,250,.25);border-radius:12px;font-size:11px;color:var(--mint);font-weight:600}
.translate-result{background:linear-gradient(135deg,rgba(94,167,255,.08),rgba(77,212,255,.03));border:1px solid rgba(94,167,255,.28);border-radius:16px;padding:20px 22px;margin-top:16px;cursor:pointer;display:none}
.translate-result.show{display:block}
.translate-result-label{font-size:10px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;font-weight:800;margin-bottom:12px}
.translate-result-jp{font-size:22px;font-weight:800;font-family:"Hiragino Sans",sans-serif;line-height:1.45;margin-bottom:8px}
.translate-result-romaji{font-size:13px;color:var(--amber);font-weight:700;margin-bottom:10px}
.translate-result-meaning{font-size:13px;color:var(--text-soft);font-weight:600;padding-top:10px;border-top:1px dashed rgba(140,160,220,.15)}
.translate-notfound{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.22);border-radius:14px;padding:16px 18px;color:#b9dcff;font-size:13px;margin-top:14px;text-align:center;display:none}
.translate-notfound.show{display:block}
.formality-box{background:linear-gradient(135deg,rgba(94,167,255,.08),rgba(94,167,255,.02));border:1px solid rgba(94,167,255,.28);border-radius:16px;padding:18px 20px;margin-top:14px;display:none}
.formality-box.show{display:block}
.formality-title{font-size:12px;font-weight:800;color:var(--violet);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.formality-category{font-size:12px;font-weight:700;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed rgba(94,167,255,.15)}
.formality-list{display:flex;flex-direction:column;gap:8px}
.formality-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:12px 16px;cursor:pointer}
.formality-level{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:100px;background:rgba(94,167,255,.15);color:var(--violet);margin-bottom:8px}
.formality-jp{font-size:15px;font-weight:700;font-family:"Hiragino Sans",sans-serif;margin-bottom:3px}
.formality-romaji{font-size:11px;color:var(--amber);font-weight:700;margin-bottom:4px}
.formality-id{font-size:12px;color:var(--text-soft);font-weight:600;margin-bottom:3px}
.formality-note{font-size:10px;color:var(--text-dim);font-style:italic}
.history-section{margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.history-title{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.history-clear{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text-soft);font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;text-transform:uppercase;padding:6px 14px;border-radius:100px}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item-row{display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:14px;padding:14px 18px;cursor:pointer}
.history-item-jp{font-size:16px;font-weight:700;font-family:"Hiragino Sans",sans-serif}
.history-item-romaji{font-size:11px;color:var(--amber);font-weight:700}
.history-item-id{font-size:12px;color:var(--text-dim)}
.history-empty{color:var(--text-dim);font-size:12px;font-style:italic;text-align:center;padding:18px}
.progress-wrap{max-width:720px;margin:22px auto 0}
.progress-bar{height:10px;background:rgba(94,167,255,.08);border-radius:100px;overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:var(--gp);width:0%;transition:width .5s;border-radius:100px}
.progress-text{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--text-dim);font-weight:600;flex-wrap:wrap;gap:6px}
.date-bar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:22px;font-size:13px;flex-wrap:wrap;gap:8px}
.date-bar .streak{display:flex;align-items:center;gap:6px;background:rgba(255,201,77,.1);border:1px solid rgba(255,201,77,.25);padding:5px 12px;border-radius:100px;color:var(--amber);font-weight:700;font-size:12px}
.section{margin-bottom:26px}
.section-title{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;flex-wrap:wrap}
.section-title .count{margin-left:auto;font-size:10px;color:#7dc0ff;background:rgba(94,167,255,.1);border:1px solid rgba(94,167,255,.25);padding:4px 10px;border-radius:100px;font-weight:800}
.task{display:flex;align-items:flex-start;gap:14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:14px 16p
